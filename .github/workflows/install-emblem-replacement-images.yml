name: Install edited LOWMODE eagle LM product images
on:
  push:
    paths:
      - '.github/workflows/install-emblem-replacement-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply real LOWMODE emblem photos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260913-realphotos4'
          for fname in ['collection.html','women.html','lookbook.html']:
              p = Path(fname)
              s = p.read_text()
              s = re.sub(r'/styles\.css\?v=[^\"\']+', f'/styles.css?v={version}', s)
              p.write_text(s)

          marker = '/* ACTUAL-EMBLEM-PHOTOS-V4 */'
          p = Path('styles.css')
          s = p.read_text()
          if marker not in s:
              s += "\n\n" + marker + "\n.product-card .product-media::after,.women-card .media::after{content:none!important;display:none!important}\n"
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          if marker not in s:
              s = s.replace('</style>', marker + '\n.card-media:after{content:none!important;display:none!important}\n</style>', 1)
          p.write_text(s)
          PY
      - name: Commit corrected site presentation
        run: |
          git config user.name "low-mode"
          git config user.email "lowmode@lowmode.ai"
          git add collection.html women.html lookbook.html styles.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use real eagle LM product photos across LOWMODE"
          git push
# direct safe installer 2026-09-13
