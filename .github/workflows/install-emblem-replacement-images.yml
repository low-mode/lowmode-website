name: Install edited LOWMODE eagle LM product images
on:
  push:
    paths:
      - 'assets/emblem-rem7.zip'
      - '.github/workflows/install-emblem-replacement-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install edited product images
        run: |
          unzip -o assets/emblem-rem7.zip -d .
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('collection.html')
          s = p.read_text()
          old = "{c:'polos',n:'Racing Edge Polo',p:64,p2:68,p3:70,d:'Deep olive / Racing stripe / Athletic collar',t:'Quarter zip / XS–3XL',art:'art polo-art p4'},"
          new = "{c:'polos',n:'Racing Edge Polo',p:64,p2:68,p3:70,d:'Deep olive / Racing stripe / Athletic collar',t:'Eagle-LM emblem / XS–3XL',img:'/assets/racing-edge-polo.webp'},"
          if old in s:
              s = s.replace(old, new)
          s = re.sub(r'/styles\.css\?v=[^\"\']+', '/styles.css?v=20260913-actualphotos3', s)
          p.write_text(s)

          for fname in ['women.html','lookbook.html']:
              p = Path(fname)
              s = p.read_text()
              s = re.sub(r'/styles\.css\?v=[^\"\']+', '/styles.css?v=20260913-actualphotos3', s)
              p.write_text(s)

          marker = '/* ACTUAL-EMBLEM-PHOTOS-V3 */'
          p = Path('styles.css')
          s = p.read_text()
          if marker not in s:
              s += "\n\n" + marker + "\n.product-card .product-media::after,.women-card .media::after{content:none!important;display:none!important}\n"
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          if marker not in s:
              s = s.replace('</style>', marker + '\n.card-media:after{content:none!important;display:none!important}\n</style>', 1)
          p.write_text(s)
          PY
      - name: Commit edited product images
        run: |
          git config user.name "low-mode"
          git config user.email "lowmode@lowmode.ai"
          git add assets collection.html women.html lookbook.html styles.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace old product emblems with eagle LM product photos"
          git push
# rerun 2026-09-13
