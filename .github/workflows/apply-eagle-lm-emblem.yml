name: Apply LOWMODE Eagle LM Emblem
on:
  push:
    paths:
      - '.github/workflows/apply-eagle-lm-emblem.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-emblem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site emblem references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          asset='/assets/lowmode-eagle-lm-emblem.webp'
          files=['collection.html','women.html','lookbook.html']
          for name in files:
              p=Path(name)
              s=p.read_text()
              s=re.sub(r'(<a class="wordmark"[^>]*>)LOWMODE<sup>™</sup>(</a>)', r'\1<img class="brand-emblem" src="'+asset+r'" alt="LOWMODE eagle LM emblem"><span>LOWMODE<sup>™</sup></span>\2', s)
              s=s.replace('Small LM emblem','Eagle-LM emblem').replace('Clean chest emblem','Eagle-LM emblem').replace('Eagle-LM embroidery','Eagle-LM emblem embroidery')
              p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<a class="brand" href="/">LOWMODE<sup>™</sup></a>','<a class="brand" href="/"><img class="brand-emblem" src="'+asset+'" alt="LOWMODE eagle LM emblem"><span>LOWMODE<sup>™</sup></span></a>')
          if 'LOWMODE-EAGLE-EMBLEM-STYLES' not in s:
              s=s.replace('</style>','''/* LOWMODE-EAGLE-EMBLEM-STYLES */\n.brand{display:flex;align-items:center;gap:10px}.brand-emblem{width:48px!important;height:36px!important;object-fit:contain!important;flex:0 0 auto}.card-media{position:relative}.card-media:after{content:"";position:absolute;right:10px;bottom:10px;width:58px;height:44px;background:url('/assets/lowmode-eagle-lm-emblem.webp') center/contain no-repeat;filter:drop-shadow(0 2px 6px #000);pointer-events:none}\n</style>''',1)
          p.write_text(s)

          p=Path('styles.css')
          s=p.read_text()
          if 'LOWMODE-EAGLE-EMBLEM-STYLES' not in s:
              s += '''\n\n/* LOWMODE-EAGLE-EMBLEM-STYLES */\n.wordmark{display:inline-flex;align-items:center;gap:10px}.brand-emblem{width:48px;height:36px;object-fit:contain;flex:0 0 auto}.product-media,.women-card .media{position:relative}.product-card .product-media::after,.women-card .media::after{content:"";position:absolute;right:10px;bottom:10px;width:58px;height:44px;background:url('/assets/lowmode-eagle-lm-emblem.webp') center/contain no-repeat;filter:drop-shadow(0 2px 6px rgba(0,0,0,.75));pointer-events:none;z-index:5}.footer-brand{display:inline-flex;align-items:center;gap:10px}.footer-brand::before{content:"";display:inline-block;width:54px;height:40px;background:url('/assets/lowmode-eagle-lm-emblem.webp') center/contain no-repeat}\n'''
          p.write_text(s)
          PY
      - name: Commit emblem update
        run: |
          git config user.name "low-mode"
          git config user.email "lowmode@lowmode.ai"
          git add index.html collection.html women.html lookbook.html styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Switch LOWMODE site to eagle LM emblem"
          git push
