name: Build LOWMODE swim image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-swim-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build crisp high-resolution JPEG
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path

          parts = []
          for p in [
              Path('assets/swim-section-0.b64'),
              Path('assets/swim-section-1.b64'),
              Path('assets/swim-section-2.b64'),
          ]:
              parts.append(p.read_text(errors='ignore'))

          s = ''.join(parts)
          s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
          s = s.replace('=', '')
          if len(s) % 4 == 1:
              s = s[:-1]
          s += '=' * ((4 - len(s) % 4) % 4)

          data = base64.b64decode(s, validate=False)
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Decoded data is not a JPEG')

          source = Path('/tmp/lowmode-swim-source.jpg')
          source.write_bytes(data)
          PY

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance
          from pathlib import Path

          source = Path('/tmp/lowmode-swim-source.jpg')
          out = Path('assets/lowmode-swim-reference.jpg')
          with Image.open(source) as im:
              im = im.convert('RGB')
              w, h = im.size
              im = im.resize((w * 4, h * 4), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.6, percent=145, threshold=2))
              im = ImageEnhance.Sharpness(im).enhance(1.12)
              im = ImageEnhance.Contrast(im).enhance(1.03)
              im.save(out, 'JPEG', quality=96, subsampling=0, optimize=True)
              print(f'Wrote {out}: {im.size[0]}x{im.size[1]}')
          PY

          file assets/lowmode-swim-reference.jpg
      - name: Commit crisp swim image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lowmode-swim-reference.jpg
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Upgrade LOWMODE swim image to high resolution"
            git push
          fi
