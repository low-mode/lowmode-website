name: Build LOWMODE swim image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-swim-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build JPEG from stored Base64 chunks
        run: |
          python3 - <<'PY'
          import base64, re
          from pathlib import Path

          parts = []
          for p in [
              Path('assets/swim-section-0.b64'),
              Path('assets/swim-section-1.b64'),
              Path('assets/swim-section-2.b64'),
          ]:
              parts.append(p.read_text(errors='ignore'))

          s = ''.join(parts)
          s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
          # Remove any internal padding markers and repair malformed trailing data.
          s = s.replace('=', '')
          if len(s) % 4 == 1:
              s = s[:-1]
          s += '=' * ((4 - len(s) % 4) % 4)

          data = base64.b64decode(s, validate=False)
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Decoded data is not a JPEG')

          out = Path('assets/lowmode-swim-reference.jpg')
          out.write_bytes(data)
          print(f'Wrote {out} ({len(data)} bytes)')
          PY
          file assets/lowmode-swim-reference.jpg
      - name: Commit generated swim image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lowmode-swim-reference.jpg
          if git diff --cached --quiet; then
            echo "No image changes"
          else
            git commit -m "Build real LOWMODE swim image"
            git push
          fi
